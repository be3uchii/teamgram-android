name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install NDK 21.4
        run: |
          mkdir -p $ANDROID_HOME/ndk
          cd $ANDROID_HOME/ndk
          wget -q https://dl.google.com/android/repository/android-ndk-r21e-linux-x86_64.zip
          unzip -q android-ndk-r21e-linux-x86_64.zip
          mv android-ndk-r21e 21.4.7075529
          ls
      - name: Build
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/21.4.7075529" >> local.properties
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -x lint
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: TMessagesProj/build/outputs/apk/**/*.apk
